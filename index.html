<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="Inspect a small Portuguese text baseline before a robot trial. Explore successful matches, ambiguous requests and deliberate abstentions."
    />
    <meta name="theme-color" content="#3f5eab" />
    <title>Portuguese Interaction Bench · Vbot studies</title>
    <link rel="icon" href="./assets/mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip" href="#main">Ir ao estudo / Skip to study</a>
    <header>
      <div class="shell header-inner">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">V</span><strong>Vbot studies</strong
          ><span>/ Gabriel Demetrios Lafis</span>
        </div>
        <nav aria-label="Project navigation">
          <a id="docs-link" href="#">Project guide</a><a id="source-link" href="#">GitHub</a
          ><label
            ><span class="skip">Idioma / Language</span
            ><select id="language" aria-label="Idioma / Language">
              <option value="pt">Português</option>
              <option value="en">English</option>
            </select></label
          >
        </nav>
      </div>
    </header>
    <main class="shell" id="main">
      <section class="hero">
        <div>
          <span id="tag" class="eyebrow"></span>
          <h1 id="hero-title"></h1>
          <p id="hero-description"></p>
          <div class="stage"><i aria-hidden="true"></i><span id="stage"></span></div>
          <a id="results-jump" class="results-jump" href="#current-example">See the result ↓</a>
        </div>
        <aside class="hero-aside">
          <div class="study-no" id="project-number"></div>
          <span class="eyebrow" id="version-label"></span>
          <p id="native-note"></p>
        </aside>
      </section>
      <section class="example-section" aria-labelledby="example-heading">
        <div class="section-heading">
          <h2 id="example-heading"></h2>
          <p id="example-hint"></p>
        </div>
        <div id="example-list" class="examples"></div>
      </section>
      <div class="active-story">
        <div>
          <h2 id="current-example"></h2>
          <p id="context"></p>
        </div>
        <button id="reset" class="text-button"></button>
      </div>
      <p class="error" id="error" role="alert"></p>
      <div id="metrics" class="metrics" aria-live="polite"></div>
      <div class="workspace">
        <aside id="controls" class="controls" aria-label="Study controls"></aside>
        <section class="canvas" aria-labelledby="chart-heading">
          <div class="canvas-head">
            <h2 id="chart-heading"></h2>
            <span class="badge">Vbot / study</span>
          </div>
          <div class="chart" id="chart"></div>
          <div class="interpretation">
            <h3 id="insight-heading"></h3>
            <p id="insight"></p>
          </div>
        </section>
      </div>
      <div class="toolbar">
        <button id="report" class="button primary" disabled></button
        ><button id="csv" class="button" disabled></button
        ><button id="export" class="button" disabled></button>
      </div>
      <section class="detail-section">
        <aside class="detail-aside">
          <span class="eyebrow" id="project-name"></span>
          <h2 id="table-heading"></h2>
          <p id="question"></p>
          <h3 id="scope-title"></h3>
          <p id="scope-text"></p>
        </aside>
        <div>
          <div class="table-scroll" id="detail-table"></div>
          <div id="comparison" class="comparison"></div>
        </div>
      </section>
      <details class="advanced">
        <summary id="advanced-label"></summary>
        <label id="scenario-label" for="scenario-json"></label
        ><textarea id="scenario-json" spellcheck="false"></textarea
        ><button class="button primary" id="apply-json"></button>
      </details>
      <footer>
        <p id="footer-note"></p>
        <p><b id="scenario-count"></b> <span id="scenario-count-label"></span> · MIT · v0.2.0</p>
      </footer>
    </main>
    <noscript
      >This workbench requires JavaScript. The repository includes a command-line interface and
      reproducible examples.</noscript
    >
    <script type="module" src="./app.mjs"></script>
  </body>
</html>
